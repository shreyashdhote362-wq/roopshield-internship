<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery Filter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Image Gallery</h1>

    <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="nature">Nature</button>
        <button class="filter-btn" data-filter="city">City</button>
        <button class="filter-btn" data-filter="food">Food</button>
    </div>

    <div class="gallery">

        <div class="gallery-item" data-category="nature">
            <img src="https://tse3.mm.bing.net/th/id/OIP.nKc0BH_t6LAViz3N2SedfAHaE7?cb=thfvnextfalcon&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Nature">
        </div>

        <div class="gallery-item" data-category="city">
            <img src="https://tse2.mm.bing.net/th/id/OIP.H1bAfCNEkMaBaEKUPG8ArgHaEo?cb=thfvnextfalcon&rs=1&pid=ImgDetMain&o=7&rm=3" alt="City">
        </div>

        <div class="gallery-item" data-category="food">
            <img src="https://tse4.mm.bing.net/th/id/OIP.y7L5QaWDdodmiFnPWVGG8AHaD9?cb=thfvnextfalcon&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Food">
        </div>

        <div class="gallery-item" data-category="nature">
            <img src="https://i0.wp.com/picjumbo.com/wp-content/uploads/beautiful-nature-mountain-scenery-with-flowers-free-photo.jpg?w=2210&quality=70" alt="Nature">
        </div>

        <div class="gallery-item" data-category="city">
            <img src="https://tse4.mm.bing.net/th/id/OIP.Bqa41sSPdbVkGWxhcnqJQwHaEo?cb=thfvnextfalcon&w=2560&h=1600&rs=1&pid=ImgDetMain&o=7&rm=3" alt="City">
        </div>

        <div class="gallery-item" data-category="food">
            <img src="https://tse1.mm.bing.net/th/id/OIP.oRSH5BXbbqoTecX7vnGJbwHaE8?cb=thfvnextfalcon&w=1000&h=667&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Food">
        </div>

    </div>

    <script src="main.js"></script>
</body>
</html>
